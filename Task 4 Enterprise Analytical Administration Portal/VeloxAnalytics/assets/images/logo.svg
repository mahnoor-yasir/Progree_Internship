<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#logoGradient)" stroke-width="4" />
  
  <!-- V Logo Shape -->
  <polygon points="50,140 100,60 150,140" fill="none" stroke="url(#logoGradient)" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Inner Lines -->
  <line x1="75" y1="120" x2="100" y2="80" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
  <line x1="125" y1="120" x2="100" y2="80" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" />
  
  <!-- Center Dot -->
  <circle cx="100" cy="100" r="6" fill="url(#logoGradient)" />
  
  <!-- Bottom Line -->
  <line x1="70" y1="140" x2="130" y2="140" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
  
  <!-- Analogy Lines -->
  <line x1="60" y1="155" x2="140" y2="155" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  
  <!-- Text -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="middle">VELOX</text>
</svg>
